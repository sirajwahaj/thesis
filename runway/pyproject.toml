[project]
name = "runway"
version = "0.1.0"
description = "Predictive pipeline monitoring for data engineering teams"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Sirajulhaq Wahaj" }]
keywords = ["dagster", "data-engineering", "monitoring", "pipeline", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "dagster>=1.12.22",
  "slack-sdk>=3.27",
  "pyyaml>=6.0",
  "numpy>=2.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
