# =============================================================================
# Helm values — dagster-thesis
#
# Configures Dagster with K8sRunLauncher for the thesis K8s benchmarking
# experiments. Each Dagster run is launched as an isolated K8s Job/Pod.
#
# Image: built locally via 'make build' and loaded into Kind via
#        'make k8s-deploy-dagster' (tag: localhost:5001/thesis-workload:latest)
#
# Resource limits: VM baseline = 4 vCPU / 4 GB RAM (Multipass).
# K8s node = 4 vCPU / 8 GB RAM (Kind). Run pod memory limit is 2Gi:
# 400MB workload buffer + ~500–600 MB Python/Dagster overhead = ~1 GB peak;
# 2Gi provides safe headroom. At L10 (10 concurrent pods × ~1 GB each = ~10 GB),
# node-level pressure may increase execution time — intended K8s isolation test (SQ2).
# =============================================================================

# ── Image ──────────────────────────────────────────────────────────────────
image:
  repository: localhost:5001/thesis-workload
  tag: latest
  pullPolicy: IfNotPresent   # Image is pre-loaded into Kind via 'kind load docker-image'

# ── Namespace ──────────────────────────────────────────────────────────────
namespace: dagster

# -- PostgreSQL (bundled via Bitnami sub-chart) ─────────────────────────────
# NOTE: Credentials below are for local Kind experimentation only.
# In production, use K8s Secrets or external secret management.
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: "16"
    pullPolicy: IfNotPresent
  auth:
    username: dagster
    password: dagster
    database: dagster
  primary:
    persistence:
      enabled: false       # Ephemeral for experiments (data is in Dagster runs, not pg)
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

# ── Dagster instance (dagster.yaml) ────────────────────────────────────────
dagster:
  dagsterHome: /opt/dagster/dagster_home
  computeLogs:
    enabled: true
    localDir: /opt/dagster/logs

  # PostgreSQL connection (from bundled sub-chart or external)
  postgresql:
    host: "dagster-thesis-postgresql"   # Bitnami service name
    port: 5432
    user: dagster
    password: dagster
    database: dagster

  # K8s Run Launcher — each job run becomes an isolated K8s Pod
  runLauncher:
    type: K8sRunLauncher
    config:
      namespace: dagster
      image:
        repository: localhost:5001/thesis-workload
        tag: latest
        pullPolicy: Never
      # Environment passed to every run pod
      envVars:
        - name: DAGSTER_HOME
          value: /opt/dagster/dagster_home
        - name: WORKLOAD_DURATION_SECONDS
          value: "30"
        - name: WORKLOAD_MEMORY_MB
          value: "400"
        - name: DAGSTER_PG_USERNAME
          value: dagster
        - name: DAGSTER_PG_PASSWORD
          value: dagster
        - name: DAGSTER_PG_HOSTNAME
          value: dagster-thesis-postgresql
        - name: DAGSTER_PG_DB
          value: dagster
      # Resource limits per run pod.
      # Memory limit is 2Gi: 400MB workload buffer + ~500-600MB Python/Dagster/NumPy
      # import overhead = ~900MB-1.0GB peak; 2Gi provides safe headroom.
      # Measured: 1Gi limit causes OOMKill due to Python framework overhead.
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "2Gi"
          cpu: "1000m"           # 1 full vCPU per run
      # Fail fast if a pod cannot be scheduled
      failPodOnRunFailure: true

# ── Webserver ──────────────────────────────────────────────────────────────
webserver:
  replicaCount: 1
  service:
    type: NodePort
    port: 3000
    nodePort: 30001          # Exposed on host via Kind extraPortMappings
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ── Daemon ─────────────────────────────────────────────────────────────────
daemon:
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

# ── Workload gRPC Server ───────────────────────────────────────────────────
workload:
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  service:
    port: 4000
