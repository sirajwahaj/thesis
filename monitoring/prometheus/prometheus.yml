# Prometheus configuration for thesis experiment monitoring
# Scrapes metrics from: node-exporter (VM/host), cAdvisor (containers),
# kube-state-metrics (K8s), and Dagster (if metrics endpoint available)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  # ── Host / VM metrics via node-exporter ─────────────────────────────────
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "thesis-host"

  # ── Container metrics via cAdvisor ──────────────────────────────────────
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: "thesis-host"

  # ── Prometheus self-monitoring ──────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── PostgreSQL metrics ──────────────────────────────────────────────────
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          instance: "dagster-db"
