# Grafana INI configuration — customize appearance and features
# Mounted as /etc/grafana/grafana.ini in the container
[server]
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[security]
admin_user = admin
admin_password = thesis2026
allow_sign_up = false
disable_gravatar = true

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_theme = dark

[auth.anonymous]
enabled = true
org_name = Thesis
org_role = Viewer

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/experiment-overview.json
min_refresh_interval = 5s

[unified_alerting]
enabled = true
min_interval = 10s

[alerting]
enabled = false

[explore]
enabled = true

[feature_toggles]
enable = traceToMetrics tempoSearch tempoBackendSearch correlations

[log]
mode = console
level = warn

[analytics]
reporting_enabled = false
check_for_updates = false
