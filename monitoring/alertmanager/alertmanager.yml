# Alertmanager configuration for thesis experiments
# Routes alerts from Prometheus to appropriate receivers
# In production you'd add email/Slack/PagerDuty — here we log + Grafana
global:
  resolve_timeout: 5m

# Inhibition rules — suppress lower severity when critical fires
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "instance"]

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - matchers:
        - severity="critical"
      receiver: "critical"
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity="info"
      receiver: "default"
      group_wait: 1m

receivers:
  - name: "default"
    # Webhook receiver — alerts visible in Alertmanager UI + Grafana
    webhook_configs:
      - url: "http://grafana:3000/api/alertmanager/grafana/api/v2/alerts"
        send_resolved: true
  - name: "critical"
    webhook_configs:
      - url: "http://grafana:3000/api/alertmanager/grafana/api/v2/alerts"
        send_resolved: true
