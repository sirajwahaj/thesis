# Dagster instance configuration
# VM: DockerRunLauncher — each job runs as a Docker container on the VM
# K8s: K8sRunLauncher is configured via Helm values (k8s/helm/dagster-thesis/values.yaml)

storage:
  postgres:
    postgres_db:
      username:
        env: DAGSTER_PG_USERNAME
      password:
        env: DAGSTER_PG_PASSWORD
      hostname:
        env: DAGSTER_PG_HOSTNAME
      db_name:
        env: DAGSTER_PG_DB
      port: 5432

run_launcher:
  module: dagster_docker
  class: DockerRunLauncher
  config:
    image: "thesis-workload:latest"
    # Use host networking so Docker containers can reach PostgreSQL at localhost:5432
    network: "host"
    container_kwargs:
      auto_remove: true
      # 1 vCPU limit — matches K8s pod resource limit (1000m)
      # Docker uses nano_cpus: 1 CPU = 1_000_000_000 nano CPUs
      nano_cpus: 1000000000
      # 1 GiB memory limit — matches K8s pod resource limit (1Gi)
      mem_limit: "1g"
    env_vars:
      - DAGSTER_HOME
      - WORKLOAD_DURATION_SECONDS
      - DAGSTER_PG_USERNAME
      - DAGSTER_PG_PASSWORD
      - DAGSTER_PG_HOSTNAME
      - DAGSTER_PG_DB

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir:
      env: DAGSTER_HOME
