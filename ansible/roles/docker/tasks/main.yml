---
# Role: docker
# Installs Docker CE on Ubuntu 22.04 and adds the ubuntu user to the docker group.
# Required for DockerRunLauncher — Dagster launches each job as a Docker container.
#
# After this role runs:
#   - Docker daemon is running and enabled
#   - ubuntu user can run docker commands without sudo
#   - The thesis-workload image is pulled/available for job execution

- name: Install Docker apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: Create Docker apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Get architecture
  ansible.builtin.command: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false

- name: Get Ubuntu codename
  ansible.builtin.command: lsb_release -cs
  register: ubuntu_codename
  changed_when: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ubuntu_codename.stdout }} stable
    state: present
    filename: docker

- name: Install Docker CE
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  register: docker_install
  retries: 3
  delay: 5
  until: docker_install is succeeded

- name: Enable and start Docker daemon
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Add ubuntu user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true

- name: Wait for Docker socket to be available
  ansible.builtin.wait_for:
    path: /var/run/docker.sock
    timeout: 30

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false
  become_user: ubuntu

- name: Verify Docker Compose plugin
  ansible.builtin.command: docker compose version
  register: compose_version
  changed_when: false
  become_user: ubuntu

- name: Print Docker and Compose versions
  ansible.builtin.debug:
    msg:
      - "Docker:  {{ docker_version.stdout }}"
      - "Compose: {{ compose_version.stdout }}"
