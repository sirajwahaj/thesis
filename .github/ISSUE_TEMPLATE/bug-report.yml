name: 🐛 Bug Report
description: Report a broken script, incorrect data, or a reproducibility issue
title: "[Bug] "
labels: ["blocked"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `bash scripts/run_experiment.sh exp1 vm`
        2. See error at level L3, run 2
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS: macOS 14 / Ubuntu 22.04
        - Python: 3.12
        - Dagster: 1.12.22
        - Kind: 0.22.0
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Output
      render: shell
